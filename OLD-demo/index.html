/* ===== Suivi : contrôles terrain, envois, connexion serveur (PocketBase old-api), repli local ===== */
const API='https://old-api.vb-safety.com';
const TONS={bienveillant:'Bienveillant',legal:'Légal',ferme:'Ferme',hors_zone:'Hors zone légale',rappel:'Rappel (rien à signaler)'};
const STATUTS={conforme:['Contrôlée conforme','#2e7d32'],non_conforme:['Contrôlée non conforme','#6d0f0f'],a_recontroler:['À recontrôler','#5b6b8c']};
let PBA=null; try{PBA=JSON.parse(localStorage.getItem('oldpb')||'null')}catch(_){}
let SV={st:{},en:{}}; // st[k]=[records], en[k]=[records]
function lkey(){return 'oldsuivi_'+D.city}
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(lkey())||'null');if(o)SV=o;else SV={st:{},en:{}}}catch(_){SV={st:{},en:{}}}}
function saveLocal(){try{localStorage.setItem(lkey(),JSON.stringify(SV))}catch(_){}}
async function pb(path,opt){opt=opt||{};const h={'Content-Type':'application/json'};if(PBA&&PBA.token)h.Authorization=PBA.token;
 const r=await fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json()}
function online(){return !!(PBA&&PBA.token&&PBA.user&&PBA.user.commune===D.city)}
async function loadSuivi(){loadLocal();if(!online())return;
 try{const g=async c=>{let page=1,out=[];for(;;){const r=await pb('/api/collections/'+c+'/records?perPage=500&page='+page+'&filter='+encodeURIComponent("commune='"+D.city+"'"));out=out.concat(r.items);if(page>=r.totalPages)break;page++}return out};
  const [a,b]=await Promise.all([g('old_statuts'),g('old_envois')]);SV={st:{},en:{}};
  a.forEach(r=>{(SV.st[r.k]=SV.st[r.k]||[]).push({id:r.id,s:r.statut,d:(r.date_controle||'').slice(0,10),c:r.controleur,m:r.commentaire})});
  b.forEach(r=>{(SV.en[r.k]=SV.en[r.k]||[]).push({id:r.id,c:r.canal,t:r.ton,d:(r.date_envoi||'').slice(0,10),r:(r.relance_le||'').slice(0,10),n:r.note})});
 }catch(e){console.warn('serveur indisponible',e)}}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function fdate(d){if(!d)return '';const [y,m,j]=d.split('-');return j+'/'+m+'/'+y}
function lastSt(k){const L=SV.st[k];if(!L||!L.length)return null;return L.slice().sort((a,b)=>a.d<b.d?-1:1).pop()}
function envois(k){return (SV.en[k]||[]).slice().sort((a,b)=>a.d<b.d?-1:1)}
async function saveStatut(k,s,d,c,m){const rec={s,d,c,m};const p=D.h.features.find(f=>f.properties.k===k);
 if(online()){try{const r=await pb('/api/collections/old_statuts/records',{method:'POST',body:{commune:D.city,agglo:D.agglo||'',k,adresse:p?p.properties.a||'':'',statut:s,date_controle:d+' 12:00:00.000Z',controleur:c,commentaire:m,auteur:PBA.user.id}});rec.id=r.id}catch(e){alert('Serveur indisponible : enregistré dans ce navigateur uniquement.')}}
 (SV.st[k]=SV.st[k]||[]).push(rec);saveLocal();restyle();legend();kpi();updTabs()}
async function delStatut(k){const L=SV.st[k]||[];const r=lastSt(k);if(!r)return;if(online()&&r.id){try{await pb('/api/collections/old_statuts/records/'+r.id,{method:'DELETE'})}catch(e){}}
 SV.st[k]=L.filter(x=>x!==r);saveLocal();restyle();legend();kpi();updTabs()}
async function logEnvoi(k,canal,ton,note){const d=today(),rec={c:canal,t:ton,d,r:(ton==='rappel'||ton==='hors_zone')?'':addDays(d,60),n:note||''};const p=D.h.features.find(f=>f.properties.k===k);
 if(online()){try{const r=await pb('/api/collections/old_envois/records',{method:'POST',body:{commune:D.city,agglo:D.agglo||'',k,adresse:p?p.properties.a||'':'',canal,ton,date_envoi:d+' 12:00:00.000Z',relance_le:rec.r?rec.r+' 12:00:00.000Z':'',note:rec.n,auteur:PBA.user.id}});rec.id=r.id}catch(e){}}
 (SV.en[k]=SV.en[k]||[]).push(rec);saveLocal();updTabs();if(tab==='fic'&&CUR&&CUR.p.k===k){const el=document.getElementById('envs');if(el)el.innerHTML=envHTML(k)}else if(tab==='ctl')ui()}

async function login(email,pw){try{const r=await fetch(API+'/api/collections/users/auth-with-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identity:email,password:pw})});
  if(!r.ok)return 'Identifiants refusés ('+r.status+').';const j=await r.json();PBA={token:j.token,user:j.record};try{localStorage.setItem('oldpb',JSON.stringify(PBA))}catch(_){}
  if(j.record.commune!==D.city)return 'Ce compte appartient à une autre commune.';await loadSuivi();restyle();legend();kpi();ui();return ''}
 catch(e){return 'Serveur VB OLD pas encore installé (old-api.vb-safety.com) : le suivi reste enregistré dans ce navigateur.'}}

 L.sort((a,b)=>o[key(a)]-o[key(b)]||(a.a||'').localeCompare(b.a||'','fr',{numeric:true}));const el=document.getElementById('lst');

function start(data){D=data;document.getElementById('ttl').textContent=D.nom+' · préparation aux feux de végétation';if(D.porge)document.getElementById('stt').textContent='Démonstration sur un feu réel · données d\'avant le feu';
 const T=[['res','Résumé'],['lst','Maisons'],['ctl','Suivi']];if(D.g)T.push(['cou','Courriers']);if(D.par)T.push(['par','Parcelles']);if(D.z)T.push(['sec','Secteurs']);
 document.getElementById('tabs').innerHTML=T.map((t,i)=>'<button class="tab'+(i?'':' on')+'" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+(D.rapport?'<button class="tab" id="rapbtn">Rapport ↗</button>':'');const k=D.k,pc=Math.round(100*k.degag/k.expo),cl=pc>=80?'#2e7d32':(pc>=60?'#ef8a17':'#c62828'),et=pc>=80?'bien préparée':(pc>=60?'à consolider':'à améliorer');
 document.getElementById('modes').innerHTML=Object.keys(MODES).map(m=>'<button data-m="'+m+'">'+MODES[m]+'</button>').join('');document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
 map=L.map('map',{zoomControl:false,preferCanvas:true,attributionControl:false});const A=D.h.features.filter(f=>f.properties.c==='a').map(f=>L.geoJSON(f).getBounds().getCenter());const q=(a,p)=>{a=a.slice().sort((x,y)=>x-y);return a[Math.floor(p*(a.length-1))]};
 const FB=L.latLngBounds([q(A.map(c=>c.lat),.05),q(A.map(c=>c.lng),.05)],[q(A.map(c=>c.lat),.95),q(A.map(c=>c.lng),.95)]);map.fitBounds(FB,{paddingTopLeft:[20,innerWidth<900?190:170],paddingBottomRight:[innerWidth<900?0:420,innerWidth<900?120:0]});
 if(innerWidth>=900)L.control.zoom({position:'bottomleft'}).addTo(map);
 const cv=CV=L.canvas({padding:.5,tolerance:6});
 const FO=L.geoJSON(D.fo,{renderer:cv,interactive:false,style:{stroke:false,fillColor:'#b9d8b0',fillOpacity:.6}}),RT=L.geoJSON(D.rt,{renderer:cv,interactive:false,style:{color:'#a7a297',weight:1}});
 const SAT=L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',{maxNativeZoom:19,maxZoom:20});
 SAT.on('tileerror',e=>{const t=e.tile,n=+(t.dataset.r||0);if(n<3){t.dataset.r=n+1;setTimeout(()=>{t.src=t.src.replace(/&_r=\d+$/,'')+'&_r='+(n+1)},600*(n+1))}});
 const setBase=v=>{BASE=v;try{localStorage.setItem('oldbase2',v)}catch(_){}
  if(v==='sat'){map.removeLayer(FO);map.removeLayer(RT);SAT.addTo(map);SAT.bringToBack();}else{map.removeLayer(SAT);FO.addTo(map);RT.addTo(map);FO.bringToBack();}
  document.querySelectorAll('#basesw button').forEach(b=>b.classList.toggle('on',b.dataset.b===v));};
 const BC=L.control({position:innerWidth<900?'topright':'bottomleft'});BC.onAdd=()=>{const d=L.DomUtil.create('div','basesw');d.id='basesw';d.innerHTML='<button data-b="plan">Plan</button><button data-b="sat">Satellite</button>';L.DomEvent.disableClickPropagation(d);d.querySelectorAll('button').forEach(b=>b.onclick=()=>setBase(b.dataset.b));return d};BC.addTo(map);
 let BASE='sat';try{BASE=localStorage.getItem('oldbase2')||'sat'}catch(_){}setBase(BASE);
 if(D.com)L.geoJSON(D.com,{renderer:cv,interactive:false,style:{color:'#555',weight:1.5,dashArray:'2 5',fill:false}}).addTo(map);
 if(D.burn)L.geoJSON(D.burn,{renderer:cv,interactive:false,style:{stroke:false,fillColor:'#6d4c41',fillOpacity:.25}}).addTo(map);
 if(D.par){PL=L.layerGroup();D.par.forEach((q,i)=>{const l=L.geoJSON(q.g,{renderer:cv,style:{color:'#5b3a8c',weight:2,dashArray:'6 4',fill:true,fillOpacity:.04}});l.eachLayer(x=>{x.idx=i;x.bindPopup('<b>Parcelle '+q.idu.slice(-6)+'</b><br>'+q.b.toLocaleString('fr')+' m² de broussaille à moins de 50 m de '+q.nm+' habitation(s) à dégager ('+q.pc+' % du total)')});PL.addLayer(l)});}
 const tip=p=>'<b>'+esc(p.a||'Habitation')+'</b><br>'+kname(key(p))+(D.porge&&p.x?' · détruite':'')+(p.k!==undefined?'<br><span class="muted">Cliquer pour la fiche</span>':'');
 H=L.geoJSON(D.h,{renderer:cv,style:sty,onEachFeature:(f,l)=>f.properties.k!==undefined?l.on('click',()=>openFiche(f.properties,l)).bindTooltip(()=>tip(f.properties),{sticky:true,direction:'top',className:'tt',offset:[0,-8]}):l.bindPopup(()=>pop(f.properties),{autoPanPaddingTopLeft:[10,190],autoPanPaddingBottomRight:[innerWidth<900?10:430,innerWidth<900?140:10]})}).addTo(map);
 MK=L.layerGroup().addTo(map);TIP=tip;
 if(D.sp&&D.sp.length){SP=L.layerGroup(D.sp.map((z,i)=>L.geoJSON(z.g,{renderer:cv,interactive:false,style:{color:'#b71c1c',weight:2,dashArray:'6 4',fillColor:'#c62828',fillOpacity:.10}})));}
 loadLocal();let M0='leg';try{M0=localStorage.getItem('oldmode')||'leg'}catch(_){}setMode(M0);
 loadSuivi().then(()=>{restyle();legend();kpi();updTabs()});if(innerWidth<900){const t=document.querySelector('.leaflet-top.leaflet-right');if(t)t.style.top=(document.getElementById('head').offsetHeight+6)+'px';}
 map.on('zoomend',()=>{const z=map.getZoom();if(z>=17)map.removeLayer(MK);else if(!map.hasLayer(MK))MK.addTo(map);});
 document.querySelectorAll('.tab[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));
 if(D.rapport)document.getElementById('rapbtn').onclick=()=>openRapport();updTabs();
 document.getElementById('grip').onclick=()=>document.getElementById('panel').classList.toggle('min');
 if(innerWidth<900)document.getElementById('panel').classList.add('min');
 document.onkeydown=e=>{if(tab!=='fic'||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Escape')go(PREV);else if(e.key==='ArrowRight')nav(1);else if(e.key==='ArrowLeft')nav(-1);};
}

<div id="gate" style="position:fixed;inset:0;z-index:5000;background:#f4f1ea;display:flex;align-items:center;justify-content:center">
<form id="gf" style="background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.15);padding:22px 22px 18px;width:min(340px,90vw)">
<div style="font-weight:700;font-size:17px;margin-bottom:4px">Démonstration · espace maire</div>
<div style="font-size:13px;color:#5d6670;margin-bottom:14px">Carte de préparation aux feux de végétation et rapport. Accès réservé : saisissez le code qui vous a été communiqué.</div>
<input id="gc" autocomplete="off" autocapitalize="characters" placeholder="Code d'accès" style="width:100%;font-size:16px;padding:10px 12px;border:1px solid #d6d0c6;border-radius:9px;letter-spacing:2px">
<button style="margin-top:10px;width:100%;font-size:15px;padding:10px;border:0;border-radius:9px;background:#1c2126;color:#fff;cursor:pointer">Entrer</button>
<div id="ge" style="color:#c62828;font-size:13px;margin-top:8px;min-height:16px"></div></form></div>
<script>
const SALT='HwkoN4jgTjI8N0luZxWGcg==',ITER=600000;let KEY=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(code){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(url){const b=new Uint8Array(await (await fetch(url,{cache:'no-store'})).arrayBuffer());
return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12)));}
let RAP=null;
async function openRapport(){const w=window.open('','_blank');if(!RAP){RAP=URL.createObjectURL(new Blob([await dec('rapport_samoreau.bin')],{type:'text/html'}));}
if(w)w.location=RAP;else location.href=RAP;}
document.getElementById('gf').onsubmit=async e=>{e.preventDefault();const ge=document.getElementById('ge');ge.textContent='Vérification…';
const code=document.getElementById('gc').value.trim().toUpperCase();
try{KEY=await derive(code);const d=JSON.parse(new TextDecoder().decode(await dec('carte_samoreau.bin')));
try{sessionStorage.setItem('oldk',code)}catch(_){}
const v=(()=>{try{return sessionStorage.getItem('oldv')}catch(_){return null}})();
if(v){await choose(v,d);return}
document.getElementById('gf').innerHTML='<div style="font-weight:700;font-size:17px;margin-bottom:4px">Choisir une commune</div><div style="font-size:13px;color:#5d6670;margin-bottom:12px">Deux exemples.</div>'+
'<button type="button" class="cv" data-v="samoreau"><b>Samoreau (77)</b><br><span>Espace maire : carte, courriers, parcelles, rapport</span></button>'+
'<button type="button" class="cv" data-v="porge"><b>Le Porge (33)</b><br><span>Feu de juillet 2026 : ce que l\'outil aurait montré avant le feu</span></button>';
document.querySelectorAll('.cv').forEach(b=>{b.style.cssText='display:block;width:100%;text-align:left;margin:8px 0;padding:11px 12px;border:1px solid #d6d0c6;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;line-height:1.35';b.querySelector('span').style.cssText='font-size:12.5px;color:#5d6670';b.onclick=()=>choose(b.dataset.v,d)});
}catch(err){ge.textContent='Code incorrect.';KEY=null;}};
async function choose(v,dsam){try{sessionStorage.setItem('oldv',v)}catch(_){}
const d=v==='samoreau'?dsam:JSON.parse(new TextDecoder().decode(await dec('carte_porge.bin')));
document.getElementById('gate').remove();start(d);}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='chg'){e.preventDefault();try{sessionStorage.removeItem('oldv')}catch(_){}location.reload()}});
try{const c=sessionStorage.getItem('oldk');if(c){document.getElementById('gc').value=c;document.getElementById('gf').requestSubmit();}}catch(_){}
</script>
