*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:#1c2126;background:#f1efe9}
#map{position:absolute;inset:0}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 8px rgba(0,0,0,.18)}
#head{position:absolute;top:10px;left:10px;z-index:1000;padding:12px 14px;max-width:calc(100% - 20px)}
#head h1{font-size:16px;margin:0}
#head .sub{font-size:12px;color:#5d6670;margin-top:1px}
.kpi{display:flex;align-items:center;gap:10px;margin-top:9px}
.kpi .pc{font-size:26px;font-weight:800;line-height:1}
.kpi .tx{font-size:12.5px;line-height:1.35}
.leg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.lb{display:flex;align-items:center;gap:6px;border:1.5px solid #e2ddd3;background:#fff;border-radius:20px;padding:5px 11px 5px 8px;font-size:13px;cursor:pointer}
.lb i{width:13px;height:13px;border-radius:4px;display:inline-block}
.lb b{font-weight:700}
.lb.on{border-color:#1c2126;background:#1c2126;color:#fff}
#panel{position:absolute;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid #eee;flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px;font-size:14px;color:#5d6670;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:#1c2126;font-weight:650;border-bottom-color:#1c2126}
#grip{display:none}
.body{overflow:auto;padding:12px 16px 18px;font-size:14px;line-height:1.5;flex:1}
.step{display:flex;gap:10px;margin:10px 0}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;background:#1c2126;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.box{border:1px solid #e6e1d7;border-radius:11px;padding:11px 12px;margin:10px 0}
.box h3{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pill{background:#c62828;color:#fff;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid #d6d0c6;background:#fff;border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
.btn.dark{background:#1c2126;color:#fff;border-color:#1c2126}
.letter{background:#faf8f3;border-left:3px solid #c62828;padding:8px 10px;font-size:13px;margin-top:8px;display:none}
.adrs{columns:2;font-size:13px;margin-top:8px;display:none}
.adrs a{display:block;color:#1c2126;text-decoration:none;padding:2px 0;break-inside:avoid;cursor:pointer}
.adrs a:hover{text-decoration:underline}
.muted{color:#5d6670;font-size:12.5px}
table.pt{border-collapse:collapse;width:100%;font-size:13px}table.pt td,table.pt th{border-bottom:1px solid #eee;padding:5px 4px;text-align:left}table.pt th{font-size:12px;color:#5d6670;font-weight:600}table.pt tr.c{cursor:pointer}table.pt tr.c:hover{background:#faf8f3}.r{text-align:right}
details{margin-top:14px;font-size:13px;color:#3a4148}summary{cursor:pointer;font-weight:600}
.pop h4{margin:0 0 2px;font-size:15px}.pop .tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;color:#fff;margin-bottom:6px}
.pop ul{margin:4px 0 6px 16px;padding:0}.pop li{margin:2px 0}
.leaflet-popup-content{font-size:13.5px;line-height:1.45;margin:12px 14px;min-width:220px}
@media(min-width:900px){#panel{top:10px;right:10px;bottom:10px;width:400px}#head{max-width:calc(100% - 440px)}}
@media(max-width:899px){
 #head{padding:10px 12px}#head h1{font-size:15px}.kpi .pc{font-size:22px}
 #panel{left:8px;right:8px;bottom:8px;max-height:46%}
 #panel.min{max-height:none}#panel.min .body{display:none}
 #grip{display:block;width:40px;height:4px;background:#d6d0c6;border-radius:3px;margin:7px auto 0;flex:none}
}

<div id="map"></div>
<div id="head" class="card">
 <h1 id="ttl"></h1>
 <div class="sub"><span id="stt">Espace maire · démonstration · données IGN 2024–2025</span> · <a href="#" id="chg" style="color:#5d6670">changer de ville</a></div>
 <div class="kpi"><div class="pc" id="pc"></div><div class="tx" id="pctx"></div></div>
 <div class="leg" id="leg"></div>
</div>
<div id="panel" class="card">
 <div id="grip"></div>
 <div class="tabs" id="tabs"></div>
 <div class="body" id="body"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
let D,map,H,MK,filt=null,tab='res',showX=true,PL=null;
const COL={a:'#c62828',s:'#f0a020',n:'#cfc9bd'};
const CAT={a:['À dégager','Habitation exposée avec de la végétation dense autour'],s:['À surveiller','Habitation exposée, abords dégagés aujourd\'hui'],n:['Non concernée','Pas de bois important à proximité']};
const MSGT={contre:'Végétation dense contre la maison',terrain:'Broussaille sur le terrain',lisiere:'Lisière boisée chez un voisin',foret:'Lisière de forêt publique'};
function sty(f){const p=f.properties,on=!filt||filt(p),x=D.porge&&showX&&p.x;return {stroke:on&&(p.c!=='n'||x),color:x?'#000':'#fff',weight:x?2.5:1,fillColor:COL[p.c],fillOpacity:on?(p.c==='n'?.75:.95):.12,opacity:on?1:0}}
function pop(p){
 let s='<div class="pop"><span class="tag" style="background:'+(p.c==='n'?'#8a8478':COL[p.c])+'">'+CAT[p.c][0]+'</span>';
 s+='<h4>'+(p.a||'Habitation')+'</h4>';
 if(D.porge) s+='<div style="margin-bottom:6px"><b>'+(p.x?'Détruite en juillet 2026':'Non détruite en juillet 2026')+'</b> <span class="muted">(classement fait avec des données d\'avant le feu)</span></div>';
 if(p.c==='n') return s+'<div>'+CAT.n[1]+'. Rien à faire.</div></div>';
 s+='<b>Pourquoi</b><ul><li>Bois ou forêt à '+(p.df<=10?'moins de 10':p.df)+' m</li>';
 if(p.c==='a') s+='<li>'+(p.c10>=150?'Végétation dense <b>contre la maison</b> (moins de 10 m)':'Végétation dense dans les 30 m autour')+'</li>';
 else s+='<li>Abords dégagés sur le relevé de 2024</li>';
 if(p.i) s+='<li>Rue sans issue : un seul accès pour les secours</li>';
 if(p.ch) s+='<li>En bordure de champ ou prairie</li>';
 s+='</ul>';if(!D.porge) s+='<b>Que faire</b><div>'+(p.c==='a'?'Courrier « '+MSGT[p.m]+' »':'Rien pour l\'instant ; à revoir au prochain relevé')+'</div>';s+='</div>';
 return s;}
function counts(){const c={a:0,s:0,n:0};D.h.features.forEach(f=>c[f.properties.c]++);return c}
function legend(){const c=counts(),el=document.getElementById('leg');el.innerHTML='';
 [['a'],['s'],['n']].forEach(([k])=>{const b=document.createElement('button');b.className='lb'+(filt&&filt.k===k?' on':'');
  b.innerHTML='<i style="background:'+COL[k]+'"></i>'+CAT[k][0]+' <b>'+c[k]+'</b>';
  b.onclick=()=>{setFilt(filt&&filt.k===k?null:Object.assign(p=>p.c===k,{k}))};el.appendChild(b)});
 if(D.porge){const b=document.createElement('button');b.className='lb'+(showX?' on':'');b.innerHTML='<i style="background:#fff;border:2.5px solid #000"></i>Détruites en juillet 2026 <b>'+D.k.det+'</b>';b.onclick=()=>{showX=!showX;restyle();legend()};el.appendChild(b);}}
function restyle(){H.setStyle(sty);if(MK)MK.eachLayer(m=>{const p=m.p,on=!filt||filt(p),x=D.porge&&showX&&p.x;m.setStyle({stroke:true,color:x?'#000':'#fff',weight:x?2.5:1.2,fillColor:COL[p.c],fillOpacity:on?.95:.1,opacity:on?1:.1});if(p.c==='a'&&on)m.bringToFront()})}
function setFilt(f){filt=f;restyle();legend();}
function zoomTo(lat,lon,z){map.setView([lat,lon],z||18);if(innerWidth<900)document.getElementById('panel').classList.add('min');}
function ui(){const k=D.k,b=document.getElementById('body');let h='';
 if(tab==='res'&&D.porge){
  h+='<p style="margin-top:0"><b>Ce que l\'outil aurait montré au maire du Porge avant le feu du 22 juillet 2026.</b> Classement fait uniquement avec des données d\'avant le feu (relevé laser IGN, occupation du sol 2021, masque forêt 2021).</p>';
  h+='<div class="box"><h3>Résultat après le feu</h3><p style="margin:6px 0 0">Habitations « à dégager » : <b>'+D.k.ta+' %</b> détruites. Autres habitations : <b>'+D.k.to+' %</b>.<br>Les '+D.k.a+' habitations à dégager contenaient '+D.k.det_a+' des '+D.k.det+' maisons détruites.</p></div>';
  h+='<p class="muted">Le contour noir montre les maisons détruites (relevé par images satellite après le feu). Beaucoup de maisons détruites ne sont pas « à dégager » : au cœur des hameaux en pleine pinède, le feu a tout pris. L\'outil sert à choisir où contrôler en premier, il ne prédit pas quelles maisons vont brûler.</p>';
 }
 if(tab==='res'&&!D.porge){
  h+='<p style="margin-top:0"><b>'+k.a+' habitations ont des abords à dégager avant l\'été.</b> Elles sont près d\'un bois et entourées de végétation dense. '+k.degag+' autres sont aussi près d\'un bois mais déjà dégagées.</p>';
  h+='<div class="step"><div class="n">1</div><div><b>Envoyer les courriers</b><br>'+D.g.length+' courriers types, un par situation, '+k.a+' adresses. <a href="#" onclick="go(\'cou\');return false">Voir les courriers</a></div></div>';
  h+='<div class="step"><div class="n">2</div><div><b>Contacter les propriétaires des parcelles boisées</b><br>Environ '+k.brou_hors+' % de la broussaille autour de ces habitations n\'est pas sur leur terrain mais sur des parcelles voisines, souvent boisées. Les 10 parcelles principales en contiennent '+k.par10+' %. <a href="#" onclick="go(\'par\');return false">Voir les parcelles</a> · <a href="#" onclick="go(\'sec\');return false">les '+D.z.length+' secteurs</a></div></div>';
  h+='<div class="step"><div class="n">3</div><div><b>Mettre à jour le plan communal de sauvegarde</b><br>'+k.imp+' habitations exposées sont dans une rue sans issue, '+k.ch+' en bordure de champ.</div></div>';
  h+='<details><summary>Comment c\'est calculé</summary><p>Une habitation est <b>exposée</b> si elle est entourée de beaucoup de nature et de peu de bâti (jardins exclus) et qu\'un bois de 5 ha ou plus (ou relié à des champs) est à moins de 100 m. Elle est <b>à dégager</b> si, en plus, la végétation entre 0,5 et 3 m de haut est dense dans les 30 m (relevé laser aérien IGN, mars 2024).</p><p>Testé sur les feux du Porge et de Biscarrosse (juillet 2026) : les habitations « à dégager » y ont été détruites environ 2 fois plus souvent que les autres.</p><p>Indicateur de préparation : part des habitations exposées dont les abords sont dégagés. Repère : bien préparée à partir de 80 %.</p><p class="muted">Samoreau n\'est pas soumise aux obligations légales de débroussaillement d\'après le zonage publié : les courriers sont des recommandations. Données 2024–2025 : un terrain débroussaillé depuis apparaît encore à dégager.</p></details>';
 }
 if(tab==='cou'){
  h+='<p class="muted" style="margin-top:0">Un même texte pour toutes les adresses d\'une situation. Chaque adresse ne reçoit qu\'un courrier.</p>';
  D.g.forEach((g,i)=>{const L=g.k==='prop'?D.par.map(q=>({a:'Parcelle '+q.idu.slice(-6)})):D.h.features.filter(f=>f.properties.m===g.k).map(f=>f.properties).sort((a,b)=>a.a.localeCompare(b.a,'fr',{numeric:true}));
   h+='<div class="box"><h3>'+g.t+'<span class="pill">'+g.n+(g.k==='prop'?' parcelles':' adresses')+'</span></h3><div class="btns">'+(g.k==='prop'?'<button class="btn dark" onclick="go(\'par\')">Voir les parcelles</button>':'<button class="btn dark" onclick="showMsg(\''+g.k+'\')">Voir sur la carte</button>')+'<button class="btn" onclick="tog(\'l'+i+'\')">Lire le courrier</button><button class="btn" onclick="cp('+i+',this)">Copier le texte</button><button class="btn" onclick="tog(\'a'+i+'\')">Adresses</button></div>';
   h+='<div class="letter" id="l'+i+'">'+g.x+'</div><div class="adrs" id="a'+i+'">'+L.map((p,j)=>g.k==='prop'?'<a onclick="goPar('+j+')">'+p.a+'</a>':'<a onclick="goAdr(\''+p.a.replace(/'/g,"\\'")+'\')">'+p.a+'</a>').join('')+'</div></div>';});
 }
 if(tab==='par'){
  h+='<p class="muted" style="margin-top:0">Parcelles cadastrales où se trouve la broussaille dans les 50 m autour des habitations à dégager, de la plus importante à la moins importante. Le nom du propriétaire s\'obtient en mairie (cadastre). Toucher une ligne pour la voir.</p><table class="pt"><tr><th>Parcelle</th><th class="r">Broussaille</th><th class="r">Part</th><th class="r">Maisons concernées</th></tr>';
  D.par.forEach((q,i)=>{h+='<tr class="c" onclick="goPar('+i+')"><td>'+q.idu.slice(-6)+(q.nb==0?' <span class="muted">· sans bâti</span>':'')+'</td><td class="r">'+q.b.toLocaleString('fr')+' m²</td><td class="r">'+q.pc+' %</td><td class="r">'+q.nm+'</td></tr>'});
  h+='</table><p class="muted">Courrier type disponible dans l\'onglet Courriers (« Propriétaires des parcelles boisées »).</p>';
 }
 if(tab==='sec'){
  h+='<p class="muted" style="margin-top:0">Secteurs où plusieurs habitations à dégager sont regroupées. Toucher un secteur pour y aller.</p>';
  D.z.forEach(z=>{h+='<div class="box" style="cursor:pointer" onclick="zoomTo('+z.lat+','+z.lon+',17)"><h3>'+z.t+'<span class="pill">'+z.n+' maison'+(z.n>1?'s':'')+'</span></h3><ul style="margin:6px 0 0 16px;padding:0;font-size:13px">'+z.mes.map(m=>'<li>'+m+'</li>').join('')+'</ul></div>'});
 }
 b.innerHTML=h;}
function go(t){if(PL){if(t==='par')PL.addTo(map);else map.removeLayer(PL);}document.querySelectorAll('.tab[data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===t));tab=t;ui();document.getElementById('panel').classList.remove('min');}
function tog(id){const e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}
function cp(i,b){navigator.clipboard&&navigator.clipboard.writeText(D.g[i].x).then(()=>{b.textContent='Copié ✓'})}
function showMsg(k){setFilt(Object.assign(p=>p.m===k,{k:'m'}));const L=[];H.eachLayer(l=>{if(l.feature.properties.m===k)L.push(l)});if(L.length)map.fitBounds(L3(L),{padding:[40,40]});if(innerWidth<900)document.getElementById('panel').classList.add('min');}
function goPar(i){const q=D.par[i];const l=L.geoJSON(q.g);map.fitBounds(l.getBounds(),{padding:[60,60],maxZoom:18});if(PL)PL.eachLayer(x=>x.setStyle({weight:x.idx===i?4:2}));if(innerWidth<900)document.getElementById('panel').classList.add('min');}
function L3(L){return L.reduce((b,l)=>b.extend(l.getBounds()),L[0].getBounds())}
function goAdr(a){H.eachLayer(l=>{if(l.feature.properties.a===a){map.fitBounds(l.getBounds(),{maxZoom:18});(l.mk||l).openPopup();}});if(innerWidth<900)document.getElementById('panel').classList.add('min');}
function start(data){D=data;document.getElementById('ttl').textContent=D.nom+' · préparation aux feux de végétation';if(D.porge)document.getElementById('stt').textContent='Démonstration sur un feu réel · données d\'avant le feu';
 const T=[['res','Résumé']];if(D.g)T.push(['cou','Courriers']);if(D.par)T.push(['par','Parcelles']);if(D.z)T.push(['sec','Secteurs']);
 document.getElementById('tabs').innerHTML=T.map((t,i)=>'<button class="tab'+(i?'':' on')+'" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+(D.rapport?'<button class="tab" id="rapbtn">Rapport ↗</button>':'');const k=D.k,pc=Math.round(100*k.degag/k.expo),cl=pc>=80?'#2e7d32':(pc>=60?'#ef8a17':'#c62828'),et=pc>=80?'bien préparée':(pc>=60?'à consolider':'à améliorer');
 document.getElementById('pc').textContent=pc+' %';document.getElementById('pc').style.color=cl;
 document.getElementById('pctx').innerHTML='<b style="color:'+cl+'">Commune '+et+' pour l\'été</b><br>'+k.degag+' des '+k.expo+' habitations exposées ont des abords dégagés';
 map=L.map('map',{zoomControl:false,preferCanvas:true,attributionControl:false});const A=D.h.features.filter(f=>f.properties.c==='a').map(f=>L.geoJSON(f).getBounds().getCenter());const q=(a,p)=>{a=a.slice().sort((x,y)=>x-y);return a[Math.floor(p*(a.length-1))]};
 const FB=L.latLngBounds([q(A.map(c=>c.lat),.05),q(A.map(c=>c.lng),.05)],[q(A.map(c=>c.lat),.95),q(A.map(c=>c.lng),.95)]);map.fitBounds(FB,{paddingTopLeft:[20,innerWidth<900?190:170],paddingBottomRight:[innerWidth<900?0:420,innerWidth<900?120:0]});
 L.control.zoom({position:innerWidth<900?'topright':'bottomleft'}).addTo(map);
 const cv=L.canvas({padding:.5,tolerance:6});
 L.geoJSON(D.fo,{renderer:cv,interactive:false,style:{stroke:false,fillColor:'#b9d8b0',fillOpacity:.6}}).addTo(map);
 L.geoJSON(D.rt,{renderer:cv,interactive:false,style:{color:'#a7a297',weight:1}}).addTo(map);
 if(D.com)L.geoJSON(D.com,{renderer:cv,interactive:false,style:{color:'#555',weight:1.5,dashArray:'2 5',fill:false}}).addTo(map);
 if(D.burn)L.geoJSON(D.burn,{renderer:cv,interactive:false,style:{stroke:false,fillColor:'#6d4c41',fillOpacity:.25}}).addTo(map);
 if(D.par){PL=L.layerGroup();D.par.forEach((q,i)=>{const l=L.geoJSON(q.g,{renderer:cv,style:{color:'#5b3a8c',weight:2,dashArray:'6 4',fill:true,fillOpacity:.04}});l.eachLayer(x=>{x.idx=i;x.bindPopup('<b>Parcelle '+q.idu.slice(-6)+'</b><br>'+q.b.toLocaleString('fr')+' m² de broussaille à moins de 50 m de '+q.nm+' habitation(s) à dégager ('+q.pc+' % du total)')});PL.addLayer(l)});}
 H=L.geoJSON(D.h,{renderer:cv,style:sty,onEachFeature:(f,l)=>l.bindPopup(()=>pop(f.properties),{autoPanPaddingTopLeft:[10,190],autoPanPaddingBottomRight:[innerWidth<900?10:430,innerWidth<900?140:10]})}).addTo(map);
 MK=L.layerGroup().addTo(map);
 H.eachLayer(l=>{const p=l.feature.properties;if(p.c==='n')return;const c=l.getBounds().getCenter();
  const m=L.circleMarker(c,{renderer:cv,radius:p.c==='a'?6:4.5});m.p=p;m.bindPopup(()=>pop(p),{autoPanPaddingTopLeft:[10,190],autoPanPaddingBottomRight:[innerWidth<900?10:430,innerWidth<900?140:10]});l.mk=m;MK.addLayer(m)});
 restyle();legend();ui();
 document.querySelectorAll('.tab[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));
 if(D.rapport)document.getElementById('rapbtn').onclick=()=>openRapport();
 document.getElementById('grip').onclick=()=>document.getElementById('panel').classList.toggle('min');
 if(innerWidth<900)document.getElementById('panel').classList.add('min');
}
</script>
<div id="gate" style="position:fixed;inset:0;z-index:5000;background:#f4f1ea;display:flex;align-items:center;justify-content:center">
<form id="gf" style="background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.15);padding:22px 22px 18px;width:min(340px,90vw)">
<div style="font-weight:700;font-size:17px;margin-bottom:4px">Démonstration · espace maire</div>
<div style="font-size:13px;color:#5d6670;margin-bottom:14px">Carte de préparation aux feux de végétation et rapport. Accès réservé : saisissez le code qui vous a été communiqué.</div>
<input id="gc" autocomplete="off" autocapitalize="characters" placeholder="Code d'accès" style="width:100%;font-size:16px;padding:10px 12px;border:1px solid #d6d0c6;border-radius:9px;letter-spacing:2px">
<button style="margin-top:10px;width:100%;font-size:15px;padding:10px;border:0;border-radius:9px;background:#1c2126;color:#fff;cursor:pointer">Entrer</button>
<div id="ge" style="color:#c62828;font-size:13px;margin-top:8px;min-height:16px"></div></form></div>
<script>
const SALT='BJSfgNaZyLdZj87fLy1lMQ==',ITER=600000;let KEY=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(code){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(url){const b=new Uint8Array(await (await fetch(url,{cache:'no-store'})).arrayBuffer());
return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12)));}
let RAP=null;
async function openRapport(){const w=window.open('','_blank');if(!RAP){RAP=URL.createObjectURL(new Blob([await dec('rapport_samoreau.bin')],{type:'text/html'}));}
if(w)w.location=RAP;else location.href=RAP;}
document.getElementById('gf').onsubmit=async e=>{e.preventDefault();const ge=document.getElementById('ge');ge.textContent='Vérification…';
const code=document.getElementById('gc').value.trim().toUpperCase();
try{KEY=await derive(code);const d=JSON.parse(new TextDecoder().decode(await dec('carte_samoreau.bin')));
try{sessionStorage.setItem('oldk',code)}catch(_){}
const v=(()=>{try{return sessionStorage.getItem('oldv')}catch(_){return null}})();
if(v){await choose(v,d);return}
document.getElementById('gf').innerHTML='<div style="font-weight:700;font-size:17px;margin-bottom:4px">Choisir une commune</div><div style="font-size:13px;color:#5d6670;margin-bottom:12px">Deux exemples.</div>'+
'<button type="button" class="cv" data-v="samoreau"><b>Samoreau (77)</b><br><span>Espace maire : carte, courriers, parcelles, rapport</span></button>'+
'<button type="button" class="cv" data-v="porge"><b>Le Porge (33)</b><br><span>Feu de juillet 2026 : ce que l\'outil aurait montré avant le feu</span></button>';
document.querySelectorAll('.cv').forEach(b=>{b.style.cssText='display:block;width:100%;text-align:left;margin:8px 0;padding:11px 12px;border:1px solid #d6d0c6;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;line-height:1.35';b.querySelector('span').style.cssText='font-size:12.5px;color:#5d6670';b.onclick=()=>choose(b.dataset.v,d)});
}catch(err){ge.textContent='Code incorrect.';KEY=null;}};
async function choose(v,dsam){try{sessionStorage.setItem('oldv',v)}catch(_){}
const d=v==='samoreau'?dsam:JSON.parse(new TextDecoder().decode(await dec('carte_porge.bin')));
document.getElementById('gate').remove();start(d);}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='chg'){e.preventDefault();try{sessionStorage.removeItem('oldv')}catch(_){}location.reload()}});
try{const c=sessionStorage.getItem('oldk');if(c){document.getElementById('gc').value=c;document.getElementById('gf').requestSubmit();}}catch(_){}
</script>
</body></html>
