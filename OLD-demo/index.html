</script>
<div id="gate" style="position:fixed;inset:0;z-index:5000;background:#f4f1ea;display:flex;align-items:center;justify-content:center">
<form id="gf" style="background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.15);padding:22px 22px 18px;width:min(340px,90vw)">
<div style="font-weight:700;font-size:17px;margin-bottom:4px">Démonstration · espace maire</div>
<div style="font-size:13px;color:#5d6670;margin-bottom:14px">Carte de préparation aux feux de végétation et rapport. Accès réservé : saisissez le code qui vous a été communiqué.</div>
<input id="gc" autocomplete="off" autocapitalize="characters" placeholder="Code d'accès" style="width:100%;font-size:16px;padding:10px 12px;border:1px solid #d6d0c6;border-radius:9px;letter-spacing:2px">
<button style="margin-top:10px;width:100%;font-size:15px;padding:10px;border:0;border-radius:9px;background:#1c2126;color:#fff;cursor:pointer">Entrer</button>
<div id="ge" style="color:#c62828;font-size:13px;margin-top:8px;min-height:16px"></div></form></div>
<script>
const SALT='kashkOd7JWrFDIhrYD39mg==',ITER=600000;let KEY=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(code){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(url){const b=new Uint8Array(await (await fetch(url,{cache:'no-store'})).arrayBuffer());
return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12)));}
let RAP=null;
async function openRapport(){const w=window.open('','_blank');if(!RAP){RAP=URL.createObjectURL(new Blob([await dec('rapport_samoreau.bin')],{type:'text/html'}));}
if(w)w.location=RAP;else location.href=RAP;}
document.getElementById('gf').onsubmit=async e=>{e.preventDefault();const ge=document.getElementById('ge');ge.textContent='Vérification…';
const code=document.getElementById('gc').value.trim().toUpperCase();
try{KEY=await derive(code);const d=JSON.parse(new TextDecoder().decode(await dec('carte_samoreau.bin')));
try{sessionStorage.setItem('oldk',code)}catch(_){}
const v=(()=>{try{return sessionStorage.getItem('oldv')}catch(_){return null}})();
if(v){await choose(v,d);return}
document.getElementById('gf').innerHTML='<div style="font-weight:700;font-size:17px;margin-bottom:4px">Choisir une commune</div><div style="font-size:13px;color:#5d6670;margin-bottom:12px">Deux exemples.</div>'+
'<button type="button" class="cv" data-v="samoreau"><b>Samoreau (77)</b><br><span>Espace maire : carte, courriers, parcelles, rapport</span></button>'+
'<button type="button" class="cv" data-v="porge"><b>Le Porge (33)</b><br><span>Feu de juillet 2026 : ce que l\'outil aurait montré avant le feu</span></button>';
document.querySelectorAll('.cv').forEach(b=>{b.style.cssText='display:block;width:100%;text-align:left;margin:8px 0;padding:11px 12px;border:1px solid #d6d0c6;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;line-height:1.35';b.querySelector('span').style.cssText='font-size:12.5px;color:#5d6670';b.onclick=()=>choose(b.dataset.v,d)});
}catch(err){ge.textContent='Code incorrect.';KEY=null;}};
async function choose(v,dsam){try{sessionStorage.setItem('oldv',v)}catch(_){}
const d=v==='samoreau'?dsam:JSON.parse(new TextDecoder().decode(await dec('carte_porge.bin')));
document.getElementById('gate').remove();start(d);}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='chg'){e.preventDefault();try{sessionStorage.removeItem('oldv')}catch(_){}location.reload()}});
try{const c=sessionStorage.getItem('oldk');if(c){document.getElementById('gc').value=c;document.getElementById('gf').requestSubmit();}}catch(_){}
</script>
</body></html>
