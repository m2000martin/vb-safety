<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VB Safety | Mesure de l'exposition professionnelle</title>
<meta id="meta-desc" name="description" content="VB Safety développe des solutions innovantes de mesure de l'exposition professionnelle pour les services de secours et l'industrie.">

<!-- Bold "VB" Favicon generated via inline SVG Data URI -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230E1E30'/><rect x='2' y='2' width='60' height='60' rx='12' fill='none' stroke='%23D9713C' stroke-width='2.5' opacity='0.7'/><text x='32' y='42' font-family='system-ui, -apple-system, sans-serif' font-weight='900' font-size='28' fill='%23E8EFF4' text-anchor='middle' letter-spacing='-0.5'>VB</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;1,300&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --nuit: #0E1E30;
    --nuit-profond: #0A1725;
    --clair: #E8EFF4;
    --doux: #93AABD;
    --signal: #D9713C;
    --signal-glow: rgba(217, 113, 60, 0.35);
    --serif: "Spectral", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--nuit);
    color: var(--clair);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    position: relative;
  }

  a {
    color: inherit;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  :focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 4px;
    border-radius: 2px;
  }

  /* ---- Interactive Canvas Background ---- */
  #particles-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Ambient bottom glow gradient overlay */
  .depot {
    position: fixed;
    inset: auto 0 0 0;
    height: 65vh;
    pointer-events: none;
    z-index: 1;
    background: linear-gradient(to top, var(--nuit-profond) 0%, rgba(14, 30, 48, 0.4) 50%, rgba(14, 30, 48, 0) 100%);
  }

  /* Main Scene Layout */
  .scene {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 clamp(24px, 6vw, 76px);
  }

  /* ---- Header ---- */
  .haut {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding-top: calc(clamp(28px, 4.5vw, 44px) + env(safe-area-inset-top, 0px));
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .marque {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.22em;
    color: var(--clair);
  }

  .actions-group {
    display: flex;
    align-items: center;
    gap: clamp(16px, 3vw, 32px);
  }

  /* Language Switcher */
  .lang-switcher {
    display: inline-flex;
    align-items: center;
    background: rgba(147, 170, 189, 0.08);
    border: 1px solid rgba(147, 170, 189, 0.2);
    border-radius: 20px;
    padding: 3px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .lang-btn {
    background: none;
    border: none;
    color: var(--doux);
    padding: 4px 10px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: var(--sans);
    font-size: 12px;
  }

  .lang-btn:hover {
    color: var(--clair);
  }

  .lang-btn.active {
    background: var(--signal);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(217, 113, 60, 0.3);
  }

  .ecrire {
    font-size: 14.5px;
    color: var(--doux);
    text-decoration: none;
    padding-bottom: 3px;
    border-bottom: 1px solid transparent;
  }

  .ecrire:hover {
    color: #fff;
    border-bottom-color: var(--signal);
  }

  /* ---- Center Hero ---- */
  .centre {
    flex: 1;
    display: flex;
    align-items: center;
    padding: clamp(56px, 11vh, 120px) 0;
  }

  .enonce {
    font-family: var(--serif);
    font-weight: 200;
    font-size: clamp(34px, 6.8vw, 76px);
    line-height: 1.12;
    letter-spacing: -0.018em;
    margin: 0;
    max-width: 15ch;
  }

  .enonce .seconde {
    display: block;
    color: var(--doux);
    font-weight: 300;
  }

  .trait {
    width: 58px;
    height: 2px;
    background: var(--signal);
    margin: clamp(30px, 4.5vw, 46px) 0 clamp(24px, 3.5vw, 34px);
    box-shadow: 0 0 10px var(--signal-glow);
  }

  .note {
    margin: 0;
    max-width: 38ch;
    color: var(--doux);
    font-size: clamp(15.5px, 1.9vw, 18px);
    line-height: 1.72;
  }

  /* ---- Footer ---- */
  .bas {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px 32px;
    padding-bottom: calc(clamp(26px, 4vw, 42px) + env(safe-area-inset-bottom, 0px));
    font-size: 13px;
    color: #6E8599;
  }

  .courriel {
    font-family: var(--serif);
    font-size: clamp(18px, 2.4vw, 22px);
    color: var(--clair);
    text-decoration: none;
    border-bottom: 1px solid rgba(217, 113, 60, 0.55);
    padding-bottom: 4px;
  }

  .courriel:hover {
    color: var(--signal);
    border-bottom-color: var(--signal);
  }

  /* ---- Entrance Animations ---- */
  @media (prefers-reduced-motion: no-preference) {
    .lever {
      opacity: 0;
      transform: translateY(16px);
      animation: lever 1s cubic-bezier(.2, .7, .3, 1) forwards;
    }
    .lever-1 { animation-delay: 0.05s; }
    .lever-2 { animation-delay: 0.22s; }
    .lever-3 { animation-delay: 0.38s; }
    .lever-4 { animation-delay: 0.54s; }

    @keyframes lever {
      to {
        opacity: 1;
        transform: none;
      }
    }
  }

  /* Dynamic translation fade transition */
  .trans-fade {
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .trans-out {
    opacity: 0;
    transform: translateY(-4px);
  }
</style>
</head>
<body>

<!-- Animated hazard detection canvas -->
<canvas id="particles-canvas" aria-hidden="true"></canvas>

<!-- Bottom atmospheric depth overlay -->
<div class="depot" aria-hidden="true"></div>

<!-- Main UI Container -->
<div class="scene">

  <header class="haut lever lever-1">
    <div class="brand-group">
      <span class="marque">VB SAFETY</span>
    </div>
    
    <div class="actions-group">
      <!-- Language Switcher Control -->
      <div class="lang-switcher" role="group" aria-label="Language selector">
        <button id="btn-fr" class="lang-btn active" onclick="setLanguage('fr')" aria-label="Passer en français">FR</button>
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')" aria-label="Switch to English">EN</button>
      </div>

      <a id="txt-write" class="ecrire trans-fade" href="mailto:contact@vbsafety.fr">Nous écrire</a>
    </div>
  </header>

  <main class="centre">
    <div>
      <h1 class="enonce lever lever-2">
        <span id="txt-headline-1" class="trans-fade">Le risque est reconnu.</span>
        <span id="txt-headline-2" class="seconde trans-fade">L'exposition reste invisible.</span>
      </h1>

      <div class="trait lever lever-3" aria-hidden="true"></div>

      <p id="txt-description" class="note lever lever-3 trans-fade">
        VB Safety développe des solutions de mesure de l'exposition professionnelle, pour les services de secours et les environnements industriels.
      </p>
    </div>
  </main>

  <footer class="bas lever lever-4">
    <a class="courriel" href="mailto:contact@vbsafety.fr">contact@vbsafety.fr</a>
    <span id="txt-footer-loc" class="trans-fade">VB Safety — France</span>
  </footer>

</div>

<script>
/* ==========================================================================
   1. TRANSLATION & DICTIONARY LOGIC
   ========================================================================== */
const dictionary = {
  fr: {
    title: "VB Safety | Mesure de l'exposition professionnelle",
    metaDesc: "VB Safety développe des solutions innovantes de mesure de l'exposition professionnelle pour les services de secours et l'industrie.",
    write: "Nous écrire",
    headline1: "Le risque est reconnu.",
    headline2: "L'exposition reste invisible.",
    description: "VB Safety développe des solutions de mesure de l'exposition professionnelle, pour les services de secours et les environnements industriels.",
    footerLoc: "VB Safety — France"
  },
  en: {
    title: "VB Safety | Occupational Exposure Measurement",
    metaDesc: "VB Safety develops innovative occupational exposure measurement solutions for emergency services and industrial environments.",
    write: "Contact us",
    headline1: "The risk is known.",
    headline2: "Exposure remains invisible.",
    description: "VB Safety develops occupational exposure measurement solutions for emergency response units and industrial environments.",
    footerLoc: "VB Safety — France"
  }
};

let currentLang = 'fr';

function setLanguage(lang) {
  if (!dictionary[lang] || currentLang === lang) return;
  
  currentLang = lang;
  try {
    localStorage.setItem('vbsafety_lang', lang);
  } catch(e) {
    // LocalStorage fallback for restricted environments
  }

  // Update HTML lang attribute
  document.documentElement.lang = lang;

  // Toggle active class on buttons
  document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');

  // Fade out elements briefly for smooth textual transition
  const transElements = document.querySelectorAll('.trans-fade');
  transElements.forEach(el => el.classList.add('trans-out'));

  setTimeout(() => {
    const data = dictionary[lang];
    document.title = data.title;
    document.getElementById('meta-desc').setAttribute('content', data.metaDesc);
    
    document.getElementById('txt-write').textContent = data.write;
    document.getElementById('txt-headline-1').textContent = data.headline1;
    document.getElementById('txt-headline-2').textContent = data.headline2;
    document.getElementById('txt-description').textContent = data.description;
    document.getElementById('txt-footer-loc').textContent = data.footerLoc;

    // Fade back in
    transElements.forEach(el => el.classList.remove('trans-out'));
  }, 180);
}

// Initialize language from saved preference or browser settings
function initLanguage() {
  let savedLang = null;
  try {
    savedLang = localStorage.getItem('vbsafety_lang');
  } catch(e) {}

  if (!savedLang) {
    const navLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    savedLang = navLang.startsWith('fr') ? 'fr' : 'en';
  }

  if (savedLang === 'en') {
    setLanguage('en');
  }
}

/* ==========================================================================
   2. DETECTION PARTICLES CANVAS SIMULATION
   Symbolizes airborne hazard particles, airborne toxins, & sensor detection nodes
   ========================================================================== */
(function() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  
  // Respect accessibility settings
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0;
  let height = 0;
  let particles = [];
  let animationFrameId = null;

  // Configuration settings
  const PARTICLE_COUNT_DESKTOP = 65;
  const PARTICLE_COUNT_MOBILE = 32;
  const MAX_CONNECT_DISTANCE = 110;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }

  class Particle {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      this.x = Math.random() * width;
      this.y = initial ? Math.random() * height : height + 10;
      this.radius = Math.random() * 1.8 + 0.6; // Small, refined particle size
      this.vy = -(Math.random() * 0.45 + 0.15); // Drifts upwards
      this.vx = (Math.random() - 0.5) * 0.25;
      this.alpha = Math.random() * 0.5 + 0.2;
      
      // Sensor pulse accent (~20% orange signal particles, ~80% light subtle blue/gray)
      this.isSignal = Math.random() < 0.22;
      this.color = this.isSignal ? '217, 113, 60' : '232, 239, 244';
      
      // Pulse animation properties
      this.pulseSpeed = Math.random() * 0.02 + 0.005;
      this.pulseAngle = Math.random() * Math.PI * 2;
    }

    update() {
      if (prefersReducedMotion) return;

      this.x += this.vx;
      this.y += this.vy;

      // Gentle pulsing of opacity
      this.pulseAngle += this.pulseSpeed;
      this.currentAlpha = this.alpha + Math.sin(this.pulseAngle) * 0.15;
      this.currentAlpha = Math.max(0.05, Math.min(0.8, this.currentAlpha));

      // Reset when particle drifts off screen top or sides
      if (this.y < -20 || this.x < -20 || this.x > width + 20) {
        this.reset(false);
      }
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color}, ${this.currentAlpha || this.alpha})`;
      ctx.fill();

      // Subtle glow ring around signal detection nodes
      if (this.isSignal) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 2.8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(217, 113, 60, ${(this.currentAlpha || this.alpha) * 0.18})`;
        ctx.fill();
      }
    }
  }

  function initParticles() {
    const count = width < 768 ? PARTICLE_COUNT_MOBILE : PARTICLE_COUNT_DESKTOP;
    particles = [];
    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }
  }

  /* Connect nearby particles with delicate detection network lines */
  function drawConnections() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < MAX_CONNECT_DISTANCE) {
          const alpha = (1 - dist / MAX_CONNECT_DISTANCE) * 0.12;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          
          // Connect orange-to-orange or generic neutral line
          if (particles[i].isSignal && particles[j].isSignal) {
            ctx.strokeStyle = `rgba(217, 113, 60, ${alpha * 1.5})`;
          } else {
            ctx.strokeStyle = `rgba(147, 170, 189, ${alpha})`;
          }
          
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);

    // Update and draw each particle
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
    }

    // Render sensor proximity grid lines
    drawConnections();

    animationFrameId = requestAnimationFrame(animate);
  }

  // Window Listeners
  window.addEventListener('resize', () => {
    resize();
    initParticles();
  });

  // Start initialization
  window.addEventListener('load', () => {
    resize();
    initParticles();
    initLanguage();
    animate();
  });
})();
</script>

</body>
</html>
